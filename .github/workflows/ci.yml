# CI: quality gate (production advisories, lint + typecheck, tests with coverage thresholds, build,
# generated-artefact drift, commitlint and buf breaking), the integration tests against real Citus,
# Cassandra, Kafka, immudb, object storage and Redis, one production image per app (built, scanned
# for fixable HIGH/CRITICAL OS vulnerabilities, not pushed), a boot check of the docker compose infra
# stack, and a smoke test that boots both app topologies from those images. A weekly scheduled run
# reports new production advisories only. Every action is pinned to a commit SHA (tag in the
# comment); .github/dependabot.yml proposes the bumps.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Mondays 05:17 UTC: the advisories job alone, so an advisory published against an unchanged
  # lockfile is reported without a push.
  schedule:
    - cron: "17 5 * * 1"

# A group keeps one pending run and drops the older one. Each push has its own group (ref + SHA):
# a push run checks only its own github.event.before range (commitlint, buf breaking), so a
# superseded pending push run would leave its range unchecked. The weekly run has its own group,
# and a pull request's new push cancels its running run.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'schedule' || github.event_name == 'push' && format('{0}-{1}', github.ref, github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.3
  CI: true
  HUSKY: 0
  NX_DAEMON: false
  NX_NO_CLOUD: true
  FORCE_COLOR: 1

jobs:
  verify:
    name: Lint, typecheck, test, build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # lerna/nx `--since` and commitlint need history

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # 24 (runtime of every tool and test)

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # bun audit --json --production minus the unexpired entries of .github/audit-ignore.json: a
      # high or critical production advisory, or an expired ignore entry, fails the job.
      - name: Production advisories (bun audit, high and critical)
        run: node scripts/check-audit.mjs

      - name: Cache Nx / ESLint results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .nx/cache
            node_modules/.cache
          key: tools-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: tools-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      # Type-aware eslint and tsc over the whole monorepo outgrow Node's default heap (~4 GB on this
      # runner): eslint died at ~4.06 GB (exit 134) on every master push since 2026-11-20.
      - name: Check (biome ci, eslint, prettier, tsc)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run check

      # Thresholds: COVERAGE_THRESHOLDS in vitest.config.ts (the measured baseline minus two points).
      - name: Unit + e2e tests with coverage
        run: bun run test:cov

      - name: Build (swc, all packages)
        run: bun run build

      # A .proto or *.schema.ts change committed without regenerating fails here. The porcelain
      # check also catches NEW (untracked) migration files, which `git diff` alone misses.
      # db:check (drizzle-kit check) fails on a forked snapshot chain (two lanes, one parent).
      - name: Generated artefacts drift (protos, migrations) + buf lint + drizzle-kit check
        run: |
          bun run proto:gen
          bun run proto:lint
          bun run db:generate
          bun run db:check
          git diff --exit-code -- domains/*/contracts/src/generated libs/transport/test/fixtures/src/generated libs/immudb/src/generated libs/immudb/proto 'domains/*/src/infrastructure/persistence/migrations/*'
          test -z "$(git status --porcelain -- domains/*/contracts/src/generated libs/transport/test/fixtures/src/generated libs/immudb/src/generated libs/immudb/proto 'domains/*/src/infrastructure/persistence/migrations/*')"

      # Releases (lerna --conventional-commits) derive versions and changelogs from commit messages;
      # husky's commit-msg hook is skipped by --no-verify and web edits, so validate the range: a
      # pull request's commits, or on a push (how merges reach master) the commits since
      # github.event.before. A new branch (before = zeros), a manual run (no before) or a force push
      # whose old head is not in the history has no range: the step says so and passes.
      - name: Commit messages (commitlint)
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$FROM" ] || [ "$FROM" = 0000000000000000000000000000000000000000 ]; then
            echo "No previous commit to compare against (new branch or manual run): skipped."
          elif ! git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            echo "::warning::$FROM is not in the history (force push?): commitlint skipped."
          else
            bunx commitlint --verbose --from "$FROM" --to "$TO"
          fi

      # A deleted field, renamed RPC or changed type in a contracts package breaks running
      # consumers: ship it as <ctx>.v2 instead (docs/RELEASING.md). New packages are skipped.
      # Against the pull request's base, or on a push against github.event.before (as above).
      - name: Proto breaking changes (buf)
        env:
          AGAINST: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$AGAINST" ] || [ "$AGAINST" = 0000000000000000000000000000000000000000 ]; then
            echo "No previous commit to compare against (new branch or manual run): skipped."
          elif ! git cat-file -e "$AGAINST^{commit}" 2>/dev/null; then
            echo "::warning::$AGAINST is not in the history (force push?): buf breaking skipped."
          else
            node scripts/check-proto-breaking.mjs --against "$AGAINST" --error-format github-actions
          fi

      - name: Config drift (.env.example, Kafka topics)
        run: |
          node scripts/check-env-example.mjs
          node scripts/docker/check-kafka-topics.mjs

  integration:
    name: Integration tests (Citus, Cassandra, Kafka, immudb, object storage, Redis)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # *.int-spec.ts only run with INTEGRATION=1 (`bun run test:int` = every '<pkg>:int' project).
    # The specs start their own containers through testcontainers (Citus, Cassandra, Kafka, immudb,
    # RustFS, fake-gcs-server; amd64 like the runner). The Redis specs use REDIS_URL, served by this
    # service container.
    services:
      redis:
        image: redis:8.10.2-alpine3.23
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # Every int project starts its own containers, several at once: pull each image once first
      # (the list comes from the image constants next to the code that starts them,
      # scripts/int-images.mjs), so no beforeAll spends its hook timeout on a download.
      - name: Pull the images of the int specs
        run: |
          images=$(node scripts/int-images.mjs)
          echo "$images" | xargs -P 4 -n 1 docker pull

      - name: Integration tests (INTEGRATION=1, testcontainers + service containers)
        run: bun run test:int

  image:
    name: Image ${{ matrix.app }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app:
          [gateway, monolith, identity-service, notifications-service, billing-service, ai-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.app }} (runtime target, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: boilerplate/${{ matrix.app }}:ci
          build-args: |
            APP=${{ matrix.app }}
            VCS_REF=${{ github.sha }}
          # One cache scope per app: the shared install layers are identical, the build layers not.
          cache-from: type=gha,scope=image-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.app }}

      # Fixable HIGH and CRITICAL vulnerabilities in the image's OS packages fail the job (npm
      # dependencies are gated by scripts/check-audit.mjs in verify). An unfixed one cannot be acted
      # on and is skipped; a fixed one is resolved by bumping DISTROLESS_IMAGE (docs/RELEASING.md).
      # The vulnerability scanner alone: Trivy's default adds the secret scanner, which flags the
      # development Stripe key placeholder in the billing images. version pins the Trivy binary
      # the action installs (its own default is v0.70.0).
      - name: Scan ${{ matrix.app }} (OS packages, fixable HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: boilerplate/${{ matrix.app }}:ci
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
          version: v0.76.2

      # The runtime Node comes from the pinned distroless digest, not from NODE_VERSION.
      - name: Inspect image
        run: |
          docker image inspect boilerplate/${{ matrix.app }}:ci \
            --format 'size={{.Size}} user={{.Config.User}} workdir={{.Config.WorkingDir}} cmd={{json .Config.Cmd}}'
          docker image ls boilerplate/${{ matrix.app }}:ci
          echo "runtime node: $(docker run --rm boilerplate/${{ matrix.app }}:ci --version)"

      # The topology job boots these exact images (no rebuild).
      - name: Save ${{ matrix.app }} for the topology smoke test
        run: docker save boilerplate/${{ matrix.app }}:ci | gzip -1 > "${RUNNER_TEMP}/image-${{ matrix.app }}.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.app }}
          path: ${{ runner.temp }}/image-${{ matrix.app }}.tar.gz
          retention-days: 1
          compression-level: 0

  topology:
    name: Topology smoke ${{ matrix.topology }}
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        topology: [monolith, microservices]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Load the app images (boilerplate/<app>:ci)
        run: for f in "${RUNNER_TEMP}"/images/image-*.tar.gz; do gunzip -c "$f" | docker load; done

      # Isolated project bp-topology-<topology>, host ports +20000; apps on the three roles through
      # PgBouncer with the boot guard in enforce; register + /v1/auth/me; an app with a superuser
      # DATABASE_URL must refuse to start; down -v. No job here starts Postgres itself: the roles
      # SQL comes from docker/postgres/init (compose) or startRlsTestPostgres (int specs).
      - name: Boot ${{ matrix.topology }}, wait for /health/ready, REST journey, guard refusal, tear down
        env:
          TAG: ci
          NO_BUILD: "1"
        run: node scripts/docker/check-topology.ts up ${{ matrix.topology }}

  compose:
    name: Compose config + infra boot
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: docker compose config (every profile combination)
        run: scripts/docker/validate-compose.sh

      - name: Boot infra, assert topics / keyspace / buckets / extensions / roles / PgBouncer, tear down
        run: scripts/docker/check-infra.sh

  # Weekly (schedule only; pushes and pull requests run the same check in verify). bun audit reads
  # bun.lock alone, so no install. A failure is the report: GitHub notifies on a failed scheduled run.
  advisories:
    name: Production advisories (weekly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Production advisories (bun audit, high and critical)
        run: node scripts/check-audit.mjs
