# CI: quality gate (lint + typecheck + tests + build + generated-artefact drift + commitlint), the
# integration tests against real Postgres/Redis, one production image per app (built, not pushed),
# a boot check of the docker compose infra stack, and a smoke test that boots both app topologies
# from those images.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.3
  CI: true
  HUSKY: 0
  NX_DAEMON: false
  NX_NO_CLOUD: true
  FORCE_COLOR: 1

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # lerna/nx `--since` and commitlint need history

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # 24 (runtime of every tool and test)

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Cache Nx / ESLint results
        uses: actions/cache@v6
        with:
          path: |
            .nx/cache
            node_modules/.cache
          key: tools-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: tools-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Check (biome ci, eslint, prettier, tsc)
        run: bun run check

      - name: Unit + e2e tests
        run: bun run test

      - name: Build (swc, all packages)
        run: bun run build

      # A .proto or *.schema.ts change committed without regenerating fails here. The porcelain
      # check also catches NEW (untracked) migration files, which `git diff` alone misses.
      # db:check (drizzle-kit check) fails on a forked snapshot chain (two lanes, one parent).
      - name: Generated artefacts drift (protos, migrations) + buf lint + drizzle-kit check
        run: |
          bun run proto:gen
          bun run proto:lint
          bun run db:generate
          bun run db:check
          git diff --exit-code -- domains/*/contracts/src/generated libs/transport/test/fixtures/src/generated libs/immudb/src/generated libs/immudb/proto 'domains/*/src/infrastructure/persistence/migrations/*'
          test -z "$(git status --porcelain -- domains/*/contracts/src/generated libs/transport/test/fixtures/src/generated libs/immudb/src/generated libs/immudb/proto 'domains/*/src/infrastructure/persistence/migrations/*')"

      # Releases (lerna --conventional-commits) derive versions and changelogs from commit messages;
      # husky's commit-msg hook is skipped by --no-verify and web edits, so validate the PR range.
      - name: Commit messages (commitlint)
        if: github.event_name == 'pull_request'
        run: >-
          bunx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      # A deleted field, renamed RPC or changed type in a contracts package breaks running
      # consumers: ship it as <ctx>.v2 instead (docs/RELEASING.md). New packages are skipped.
      - name: Proto breaking changes (buf, PRs only)
        if: github.event_name == 'pull_request'
        run: >-
          node scripts/check-proto-breaking.mjs
          --against ${{ github.event.pull_request.base.sha }}
          --error-format github-actions

      - name: Config drift (.env.example, Kafka topics)
        run: |
          node scripts/check-env-example.mjs
          node scripts/docker/check-kafka-topics.mjs

  integration:
    name: Integration tests (real Postgres + Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # *.int-spec.ts only run with INTEGRATION=1 (`bun run test:int` = every '<pkg>:int' project).
    # Postgres comes from testcontainers (@platform/testing/postgres: citusdata/citus:14.2.0, single
    # node, amd64 like the runner); the Redis specs use REDIS_URL, served by this service container.
    services:
      redis:
        image: redis:8.10.2-alpine3.23
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # Every Postgres int project starts its own container in parallel: pull the image once first,
      # so no beforeAll spends its 180 s hook timeout on the download.
      - name: Pull the Citus image of the Postgres int specs
        run: docker pull citusdata/citus:14.2.0

      - name: Integration tests (INTEGRATION=1, testcontainers + service containers)
        run: bun run test:int

  image:
    name: Image ${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [gateway, monolith, identity-service, notifications-service, billing-service]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.app }} (runtime target, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: boilerplate/${{ matrix.app }}:ci
          build-args: |
            APP=${{ matrix.app }}
            VCS_REF=${{ github.sha }}
          # One cache scope per app: the shared install layers are identical, the build layers not.
          cache-from: type=gha,scope=image-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.app }}

      - name: Inspect image
        run: |
          docker image inspect boilerplate/${{ matrix.app }}:ci \
            --format 'size={{.Size}} user={{.Config.User}} workdir={{.Config.WorkingDir}} cmd={{json .Config.Cmd}}'
          docker image ls boilerplate/${{ matrix.app }}:ci

      # The topology job boots these exact images (no rebuild).
      - name: Save ${{ matrix.app }} for the topology smoke test
        run: docker save boilerplate/${{ matrix.app }}:ci | gzip -1 > "${RUNNER_TEMP}/image-${{ matrix.app }}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.app }}
          path: ${{ runner.temp }}/image-${{ matrix.app }}.tar.gz
          retention-days: 1
          compression-level: 0

  topology:
    name: Topology smoke ${{ matrix.topology }}
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        topology: [monolith, microservices]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Load the app images (boilerplate/<app>:ci)
        run: for f in "${RUNNER_TEMP}"/images/image-*.tar.gz; do gunzip -c "$f" | docker load; done

      # Isolated project bp-topology-<topology>, host ports +20000; apps on the three roles through
      # PgBouncer with the boot guard in enforce; register + /v1/auth/me; an app with a superuser
      # DATABASE_URL must refuse to start; down -v. No job here starts Postgres itself: the roles
      # SQL comes from docker/postgres/init (compose) or startRlsTestPostgres (int specs).
      - name: Boot ${{ matrix.topology }}, wait for /health/ready, REST journey, guard refusal, tear down
        env:
          TAG: ci
          NO_BUILD: "1"
        run: node scripts/docker/check-topology.ts up ${{ matrix.topology }}

  compose:
    name: Compose config + infra boot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: docker compose config (every profile combination)
        run: scripts/docker/validate-compose.sh

      - name: Boot infra, assert topics / keyspace / buckets / extensions / roles / PgBouncer, tear down
        run: scripts/docker/check-infra.sh
