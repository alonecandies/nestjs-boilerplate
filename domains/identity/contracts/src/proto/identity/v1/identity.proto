syntax = "proto3";

// Identity bounded context: authentication (sessions/JWT) and user management.
package identity.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Credential flows. Every successful flow returns a fresh access + refresh token pair.
service AuthService {
  // Creates a user and opens a session.
  rpc Register(RegisterRequest) returns (AuthTokens);
  // Verifies credentials and opens a session.
  rpc Login(LoginRequest) returns (AuthTokens);
  // Rotates a refresh token. Reusing a revoked refresh token revokes every session of the user.
  rpc RefreshTokens(RefreshTokensRequest) returns (AuthTokens);
  // Revokes the session and denylists the access token for its remaining lifetime.
  rpc Logout(LogoutRequest) returns (google.protobuf.Empty);
  // Moves the caller's session to another tenant: rotates the refresh token into a session there and
  // denylists the current access token. Not a member → PERMISSION_DENIED / TENANT_ACCESS_DENIED.
  rpc SwitchTenant(SwitchTenantRequest) returns (AuthTokens);
  // Platform staff enters a tenant for support: an access token only (admin + staff, short TTL), audited
  // in the tenant. Not staff → PERMISSION_DENIED / STAFF_ONLY; unknown tenant → NOT_FOUND.
  rpc StaffSwitchIn(StaffSwitchInRequest) returns (StaffAccessToken);
  // Platform staff leaves the tenant: denylists the switch-in token and audits the exit.
  rpc StaffSwitchOut(StaffSwitchOutRequest) returns (google.protobuf.Empty);
}

// User queries and administration.
service UsersService {
  rpc GetUser(GetUserRequest) returns (User);
  // Batch lookup (DataLoader backend). Unknown ids are omitted; order follows the request.
  rpc GetUsersByIds(GetUsersByIdsRequest) returns (UserList);
  // Keyset-paginated listing (uuidv7 ids, newest first).
  rpc ListUsers(ListUsersRequest) returns (UserPage);
  // Retired in B2 (global roles removed): always FAILED_PRECONDITION / GLOBAL_ROLES_REMOVED.
  rpc UpdateUserRoles(UpdateUserRolesRequest) returns (User);
}

// Tenancy (B2-12..B2-14). Requests name the acting user and tenant explicitly (copied from the access
// token by the gateway); the principal in the gRPC metadata repeats them and the service cross-checks.
service TenantsService {
  // The caller's tenants with their roles, most recently active first.
  rpc ListMyTenants(ListMyTenantsRequest) returns (MyTenantList);
  // A new tenant with the caller as its only owner.
  rpc CreateTenant(CreateTenantRequest) returns (MyTenant);
  // Renames the actor's active tenant (owner only: tenant:manage).
  rpc RenameTenant(RenameTenantRequest) returns (Tenant);
  // Members of a tenant (keyset pages on user id, newest first).
  rpc ListMembers(ListMembersRequest) returns (MemberPage);
  // Replaces a member's roles (members:manage; owner rank to grant or revoke owner; never the last owner).
  rpc UpdateMemberRoles(UpdateMemberRolesRequest) returns (Member);
  // Removes a member (members:manage; owner rank for an owner; never the last owner).
  rpc RemoveMember(RemoveMemberRequest) returns (google.protobuf.Empty);
  // The caller leaves a tenant (never the last owner).
  rpc LeaveTenant(LeaveTenantRequest) returns (google.protobuf.Empty);
  // Invites an email with roles and mails the accept link (members:manage; owner rank to invite an owner).
  rpc CreateInvitation(CreateInvitationRequest) returns (Invitation);
  // The logged-in caller (whose email must match) joins the invitation's tenant.
  rpc AcceptInvitation(AcceptInvitationRequest) returns (MyTenant);
}

message User {
  string id = 1;
  string email = 2;
  string display_name = 3;
  // Always empty since B2: roles are per tenant (AuthTokens.tenant_roles).
  repeated string roles = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message AuthTokens {
  string access_token = 1;
  string refresh_token = 2;
  // Access token lifetime in seconds.
  int32 expires_in = 3;
  // Always "Bearer".
  string token_type = 4;
  User user = 5;
  // The session's tenant: the access token's active tenant.
  string tenant_id = 6;
  // The user's roles in tenant_id: "owner" | "admin" | "member".
  repeated string tenant_roles = 7;
}

// Client fingerprint stored on the session (audit / theft investigation).
message ClientInfo {
  optional string user_agent = 1;
  optional string ip = 2;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
  ClientInfo client = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  ClientInfo client = 3;
  // The tenant to open the session in (a UUID). Absent: the most recently active membership.
  // Not a member (unknown and nil ids included) → PERMISSION_DENIED / TENANT_ACCESS_DENIED.
  optional string tenant_id = 4;
}

message RefreshTokensRequest {
  string refresh_token = 1;
  ClientInfo client = 2;
}

message LogoutRequest {
  string user_id = 1;
  string access_token_jti = 2;
  // Access token `exp` claim (epoch seconds); bounds the denylist entry TTL.
  int64 access_token_exp = 3;
  // When present, only the session bound to this refresh token is revoked.
  optional string refresh_token = 4;
}

message SwitchTenantRequest {
  string user_id = 1;
  string tenant_id = 2;
  string refresh_token = 3;
  string access_token_jti = 4;
  // Access token `exp` claim (epoch seconds); bounds the denylist entry TTL.
  int64 access_token_exp = 5;
  ClientInfo client = 6;
}

message StaffSwitchInRequest {
  string staff_user_id = 1;
  string tenant_id = 2;
  // Why staff enters (audited), 1..1000 characters.
  string reason = 3;
  ClientInfo client = 4;
}

message StaffSwitchOutRequest {
  string staff_user_id = 1;
  string tenant_id = 2;
  string access_token_jti = 3;
  // Switch-in token `exp` (epoch seconds); bounds the denylist entry TTL.
  int64 access_token_exp = 4;
}

message StaffAccessToken {
  string access_token = 1;
  // Lifetime in seconds (STAFF_SWITCH_IN_TTL_SEC).
  int32 expires_in = 2;
  // Always "Bearer".
  string token_type = 3;
  string tenant_id = 4;
  // The identity.audit_events row recording the switch-in.
  string audit_event_id = 5;
}

message GetUserRequest {
  string id = 1;
  // Scope: only a member of this tenant is found (else NOT_FOUND). Absent: any user (own profile, internal).
  optional string tenant_id = 2;
}

message GetUsersByIdsRequest {
  repeated string ids = 1;
}

message UserList {
  repeated User users = 1;
}

message ListUsersRequest {
  int32 limit = 1;
  // Opaque cursor from a previous UserPage.next_cursor.
  optional string cursor = 2;
  // Case-insensitive substring match on email / display name.
  optional string search = 3;
  // Required since B2: list the members of this tenant only (INVALID_ARGUMENT when absent).
  optional string tenant_id = 4;
}

message UserPage {
  repeated User items = 1;
  // Absent on the last page.
  optional string next_cursor = 2;
}

message UpdateUserRolesRequest {
  string id = 1;
  repeated string roles = 2;
  // Unused since B2.
  string actor_id = 3;
}

// A tenant (workspace).
message Tenant {
  string id = 1;
  string slug = 2;
  string name = 3;
  bool personal = 4;
  google.protobuf.Timestamp created_at = 5;
}

// One of the caller's tenants and their roles in it.
message MyTenant {
  Tenant tenant = 1;
  repeated string roles = 2;
  google.protobuf.Timestamp last_active_at = 3;
}

// The caller's tenants, most recently active first.
message MyTenantList {
  repeated MyTenant items = 1;
}

// A member of a tenant with their roles in it.
message Member {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  repeated string roles = 4;
  google.protobuf.Timestamp joined_at = 5;
}

// One keyset page of tenant members.
message MemberPage {
  repeated Member items = 1;
  // Pass as cursor for the next page; absent on the last page.
  optional string next_cursor = 2;
}

// A pending invitation to join a tenant (the raw token is only ever mailed).
message Invitation {
  string id = 1;
  string tenant_id = 2;
  string email = 3;
  repeated string roles = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp created_at = 6;
}

// Lists the tenants the user belongs to.
message ListMyTenantsRequest {
  string user_id = 1;
}

// Creates a tenant owned by the user.
message CreateTenantRequest {
  string user_id = 1;
  string name = 2;
}

// Renames a tenant on behalf of the actor.
message RenameTenantRequest {
  string tenant_id = 1;
  string actor_id = 2;
  string name = 3;
}

// Lists one page of a tenant's members.
message ListMembersRequest {
  string tenant_id = 1;
  int32 limit = 2;
  // Opaque cursor from a previous MemberPage.next_cursor.
  optional string cursor = 3;
}

// Replaces a member's roles on behalf of the actor.
message UpdateMemberRolesRequest {
  string tenant_id = 1;
  string actor_id = 2;
  string user_id = 3;
  repeated string roles = 4;
}

// Removes a member on behalf of the actor.
message RemoveMemberRequest {
  string tenant_id = 1;
  string actor_id = 2;
  string user_id = 3;
}

// The user leaves a tenant.
message LeaveTenantRequest {
  string tenant_id = 1;
  string user_id = 2;
}

// Invites an email to a tenant on behalf of the actor.
message CreateInvitationRequest {
  string tenant_id = 1;
  string actor_id = 2;
  string email = 3;
  repeated string roles = 4;
}

// Accepts an invitation as the logged-in user.
message AcceptInvitationRequest {
  string user_id = 1;
  // The raw token from the invitation mail (base64url, 43 chars); stored hashed.
  string token = 2;
}
