# Platform alerts (audit fixes Tasks 4 and 21). The series come from @platform/transport (Kafka in
# libs/transport/src/kafka/kafka-metrics.ts, gRPC in libs/transport/src/grpc/grpc-metrics.ts),
# @platform/redis (rate_limit_fail_open_total, redis_eviction_policy_safe), @platform/database
# (db_pool_operations_waiting), @platform/observability (http_request_duration_seconds) and
# @platform/mailer (mail_jobs_total); Prometheus adds `service` from the scrape target.
# severity: page = wake someone; ticket = look at it in working hours. promtool tests:
# docker/prometheus/tests/platform.rules.test.yml (scripts/docker/check-prometheus-rules.sh).
groups:
  - name: platform
    rules:
      # A consumer gave up on a message after its in-process retries and published it to
      # `<topic>.dlq`. The event's effect is missing until it is replayed, and the shipped topic config
      # deletes `.dlq` records after 14 days. Resolves 15 minutes after the last dead letter.
      - alert: KafkaDeadLetters
        expr: >-
          sum by (service, topic)
          (increase(kafka_consumer_messages_total{outcome="dead_letter"}[15m])) > 0
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.service }}: {{ $labels.topic }} messages were dead-lettered"
          description: >-
            {{ $value | humanize }} message(s) of {{ $labels.topic }} went to {{ $labels.topic }}.dlq in
            the last 15 minutes on {{ $labels.service }}. Find the cause in that service's logs (the
            x-error-* headers of the .dlq record name it), fix it, then replay the topic with
            dist/cli/dlq-replay.js before the .dlq retention deletes the records. See the dead-letter
            runbook in docs/OBSERVABILITY.md.

      # A handler left messages to kafkajs for redelivery (a KafkaRetriableException, or a failed
      # publish to `.dlq`) at a steady rate for 15 minutes. Nothing is lost yet, but the consumer keeps
      # re-reading the same messages and lag follows. The `redelivery` series start at 0 for every
      # subscribed topic (initKafkaTopicMetrics), so the first redelivery is an increase.
      - alert: KafkaRedeliveries
        expr: >-
          sum by (service, topic)
          (rate(kafka_consumer_messages_total{outcome="redelivery"}[5m])) > 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.service }}: {{ $labels.topic }} messages keep being redelivered"
          description: >-
            {{ $value | humanize }} message(s) per second of {{ $labels.topic }} have been left for
            redelivery on {{ $labels.service }} for 15 minutes. Look for the retriable error in that
            service's logs (a dependency that is down, or the DLQ publish failing) and at the
            consumer's lag.

      # Lag above 1000 messages that also grew over the last 15 minutes: a consumer that progresses
      # too slowly (slow handler, too few replicas). kafka_consumer_lag is set only at the end of a
      # batch (END_BATCH_PROCESS), so an idle partition and a hung handler both freeze it and a high
      # but flat lag does not fire: this rule cannot see a hung consumer. Detecting one needs a
      # broker-side lag source (for example kafka-exporter's kafka_consumergroup_lag), a follow-up.
      - alert: KafkaConsumerLagGrowing
        expr: >-
          kafka_consumer_lag > 1000
          and delta(kafka_consumer_lag[15m]) > 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.service }}: group {{ $labels.group }} falls behind on {{ $labels.topic }}"
          description: >-
            Partition {{ $labels.partition }} of {{ $labels.topic }} is {{ $value | humanize }} messages
            behind for group {{ $labels.group }} and the lag grew over 15 minutes. Check the handler's
            latency, kafka_consumer_messages_total{outcome="redelivery"} and the replica count.

      # A gRPC client circuit breaker has not been closed for 5 minutes while its upstream keeps
      # refusing or failing calls: the upstream is down or too slow. Against a hung upstream the breaker
      # cycles open (5 s) and half_open (the probe waits out GRPC_DEADLINE_MS), so the rule reads "not
      # closed" rather than "open". An idle breaker stays half_open until its next call (opossum), so
      # rejected or failed calls of that same (service, upstream) in the last 2 minutes are required
      # too: an idle breaker next to a refusing one of the same service stays silent, and failed
      # half-open probes of sparse traffic count. The 2 m window is shorter than the `for`, so one burst
      # followed by silence never pages; it covers traffic of at least about one call a minute. Limit:
      # a breaker is created by its first call, so `rate()` sees its first event only when a scrape saw
      # the series at 0 first.
      - alert: GrpcCircuitBreakerOpen
        expr: >-
          max by (service, upstream)
          (grpc_client_circuit_breaker_state{state!="closed"}) == 1
          and on (service, upstream)
          sum by (service, upstream)
          (rate(grpc_client_circuit_breaker_events_total{event=~"reject|failure"}[2m])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.service }}: circuit breaker to {{ $labels.upstream }} refuses calls"
          description: >-
            The circuit breaker from {{ $labels.service }} to {{ $labels.upstream }} has not been closed
            for 5 minutes and keeps rejecting or failing calls to it. Check that upstream's health,
            latency and logs, and
            grpc_client_circuit_breaker_events_total{upstream="{{ $labels.upstream }}"} by event.

      # Calls to an upstream fail on a path too quiet to open its breaker (it opens only once its 10 s
      # window holds 10 calls): at least 3 failures in 15 minutes, and more failures than successes in
      # the same window. Counts instead of a ratio, so one blip cannot fire it and nothing divides by
      # zero. `failure` is an upstream failure (UNAVAILABLE, DEADLINE_EXCEEDED, INTERNAL, ...); a caller
      # error the breaker's errorFilter lets through counts as `success`. Limits: fewer than 3 calls in
      # 15 minutes raise nothing, and `reject` is left out (those calls never reached the upstream;
      # GrpcCircuitBreakerOpen covers them).
      - alert: GrpcUpstreamFailing
        expr: >-
          sum by (service, upstream)
          (increase(grpc_client_circuit_breaker_events_total{event="failure"}[15m])) >= 3
          and on (service, upstream)
          sum by (service, upstream)
          (increase(grpc_client_circuit_breaker_events_total{event="failure"}[15m]))
          > sum by (service, upstream)
          (increase(grpc_client_circuit_breaker_events_total{event="success"}[15m]))
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.service }}: calls to {{ $labels.upstream }} keep failing"
          description: >-
            {{ $value | humanize }} call(s) from {{ $labels.service }} to {{ $labels.upstream }} failed
            in the last 15 minutes, more than succeeded. Traffic this light may never open the circuit
            breaker, so GrpcCircuitBreakerOpen can stay silent. Check that upstream's health and logs,
            and grpc_client_handled_total by grpc_code for its grpc_service.

      # A rate-limit budget let requests through unmetered because Redis was down or slow
      # (THROTTLE_REDIS_TIMEOUT_MS). Abuse protection is off for that throttler until Redis recovers.
      # The series of every throttler start at 0 when the module boots, so the first fail-open counts.
      - alert: RateLimitFailOpen
        expr: >-
          sum by (service, throttler) (increase(rate_limit_fail_open_total[5m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.service }}: the {{ $labels.throttler }} rate limit failed open"
          description: >-
            {{ $value | humanize }} request(s) passed the {{ $labels.throttler }} throttler unlimited in
            the last 5 minutes because Redis did not answer in time. Check Redis (latency, memory,
            connections) and THROTTLE_REDIS_TIMEOUT_MS.

      # Operations beyond the pool size waited for a connection for 10 minutes: the pool is
      # saturated (slow queries, a leak, too small DATABASE_POOL_MAX), not a spike.
      - alert: DbPoolSaturated
        expr: max by (service, pool) (db_pool_operations_waiting) > 0
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.service }}: the {{ $labels.pool }} database pool is saturated"
          description: >-
            {{ $value | humanize }} operation(s) have been waiting beyond the {{ $labels.pool }} pool size
            for 10 minutes. Look for slow queries and long transactions, and compare
            db_pool_connections_in_use with db_pool_connections_max.

      # More than 5 % of a service's HTTP responses were 5xx for 10 minutes (rates over 5 minutes).
      # Requests that fail because an upstream is down count too: that is what callers see.
      - alert: HttpServerErrorRatio
        expr: >-
          sum by (service) (rate(http_request_duration_seconds_count{status_code=~"5.."}[5m]))
          / sum by (service) (rate(http_request_duration_seconds_count[5m])) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.service }}: {{ $value | humanizePercentage }} of responses are 5xx"
          description: >-
            More than 5 % of the responses of {{ $labels.service }} have been 5xx for 10 minutes. Group
            http_request_duration_seconds_count{status_code=~"5.."} by route, then read that route's
            error logs (requestId ties them to the request) and the circuit breaker state.

      # The Redis behind the denylist, queues, locks and throttle counters can evict keys. Set once
      # at boot from INFO memory; absent when the policy cannot be read, so this never fires on a guess.
      - alert: RedisEvictionPolicyUnsafe
        expr: min by (service) (redis_eviction_policy_safe) == 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.service }}: Redis can evict keys"
          description: >-
            The Redis of {{ $labels.service }} has a maxmemory-policy other than noeviction, so under
            memory pressure it can drop revoked-token entries, queued jobs and locks. Set
            maxmemory-policy to noeviction (docs/SECURITY.md, production checklist) and restart the
            service so the check runs again.

      # A mail job ran out of attempts (or hit a permanent error) and was dropped: the mail was not
      # sent. `failed` starts at 0 in every process that runs the worker (MailProcessor).
      - alert: MailJobsFailed
        expr: sum by (service) (increase(mail_jobs_total{outcome="failed"}[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.service }}: {{ $value | humanize }} mail job(s) failed for good"
          description: >-
            Mail jobs failed after their last attempt or with a permanent error (template bug, SMTP
            5xx rejection) in the last 15 minutes. The failed jobs stay in the `mail` queue for 7 days:
            read the worker's "Giving up on" log lines (recipients are masked) and the SMTP settings.
