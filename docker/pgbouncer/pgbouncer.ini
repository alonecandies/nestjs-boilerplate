; PgBouncer 1.26, transaction pooling, for the compose stack (sharding design section 5).
; Mounted read-only at /etc/pgbouncer (docker-compose.yml, service pgbouncer). LOCAL ONLY: the
; userlist holds the dev role passwords. Production: auth_user = pgbouncer_auth with
;   auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)
; instead of auth_file (docker/postgres/init/03-pgbouncer-auth.sql; docs/SECURITY.md).
;
; Who connects here: app_runtime (every request) and app_system (the named system methods, at most
; 5 server connections). app_owner never does: the migrator holds a session advisory lock and goes
; straight to postgres:5432, so it is not in the userlist and cannot log in through this port.

[databases]
; Any database name resolves to the coordinator (POSTGRES_DB is overridable in compose).
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

; A session-level setting would leak to the next client of a server connection.
pool_mode = transaction
; Server-side prepared statements stay on (postgres.js prepare=true): PgBouncer re-prepares them.
max_prepared_statements = 200

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; SHOW POOLS / SHOW CLIENTS for scripts/docker/check-infra.sh and operators. Read-only: nobody is
; an admin, so there is no PAUSE, KILL or RELOAD from the console.
admin_users =
stats_users = app_system

; extra_float_digits is the only startup parameter ignored. statement_timeout and
; idle_in_transaction_session_timeout must NOT be listed: the roles carry them (ALTER ROLE ... SET),
; and PgBouncer's refusal (08P01) of statement_timeout as a startup parameter is how the migration
; runner detects that it was pointed at a pooler instead of the coordinator.
ignore_startup_parameters = extra_float_digits

; Sizing (design section 5): default_pool_size is the coordinator capacity for app_runtime;
; max_client_conn >= replicas x (DATABASE_POOL_MAX + DATABASE_SYSTEM_POOL_MAX).
default_pool_size = 20
max_client_conn = 500

server_tls_sslmode = prefer
log_connections = 0
log_disconnections = 0

[users]
; The system pool never exceeds 5 connections, whatever DATABASE_SYSTEM_POOL_MAX says.
app_system = pool_size=5 max_user_connections=5
