syntax = "proto3";

// Notifications bounded context: per-user inbox stored in Cassandra.
package notifications.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service NotificationsService {
  // Newest first; paged with Cassandra paging state (opaque, not an offset).
  rpc ListNotifications(ListNotificationsRequest) returns (NotificationPage);
  // Idempotent. Fails with NOT_FOUND when the notification does not belong to the user.
  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (google.protobuf.Empty);
}

message Notification {
  string id = 1;
  string user_id = 2;
  // "welcome" | "payment_receipt" | "digest" | "system".
  string type = 3;
  string title = 4;
  string body = 5;
  bool read = 6;
  // Free-form string attributes for clients (deep links, ids).
  map<string, string> data = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListNotificationsRequest {
  string user_id = 1;
  int32 limit = 2;
  // Opaque paging state from a previous NotificationPage.next_page_state.
  optional string page_state = 3;
}

message NotificationPage {
  repeated Notification items = 1;
  // Absent on the last page.
  optional string next_page_state = 2;
}

message MarkNotificationReadRequest {
  string user_id = 1;
  string notification_id = 2;
}
