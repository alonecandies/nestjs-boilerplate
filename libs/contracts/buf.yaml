# Shared buf policy of every domains/<x>/contracts package (and of the @platform/transport test
# fixture). Each package runs buf from its own folder with
# `--config ../../../libs/contracts/buf.yaml`, so `src/proto` below is THAT package's proto root:
# buf rejects module paths outside the folder it runs in, so one workspace listing every domain is
# impossible. Protos live under src/ so swc `copyFiles` ships them to dist/proto.
version: v2
modules:
  - path: src/proto
lint:
  use:
    - STANDARD
  except:
    # Domain-shaped responses are shared on purpose (Register/Login/RefreshTokens all return
    # AuthTokens; GetUser/UpdateUserRoles return User; commands return google.protobuf.Empty).
    # Wrapping each in a unique <Rpc>Response message would only add allocation + mapping noise.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
