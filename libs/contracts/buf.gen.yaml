# Shared ts-proto (NestJS flavour) template for native ESM. Every domains/<x>/contracts package (and
# the @platform/transport test fixture) runs it from its own folder, so `src/proto` and
# `src/generated` below are that package's. Run `bun run proto:gen` at the root (needs `node` on
# PATH: the plugin is a `#!/usr/bin/env node` script). The output is committed; never edit
# src/generated by hand.
#
# These options are mirrored by GRPC_LOADER_OPTIONS (src/grpc/grpc-package-spec.ts). Change both together:
#   snakeToCamel (default) <-> keepCase: false
#   forceLong=string       <-> longs: String
#   stringEnums=true       <-> enums: String
#   useDate=true           <-> Timestamp <-> Date wrapper registered on the shared protobufjs instance
version: v2
clean: true
plugins:
  # Resolved through PATH: `bun run` prepends the ROOT node_modules/.bin, which is where the
  # hoisted linker puts every bin (no package has its own node_modules).
  - local: protoc-gen-ts_proto
    out: src/generated
    # ts-proto must see every file in one invocation (cross-file imports, well-known types).
    strategy: all
    opt:
      - nestJs=true
      - addGrpcMetadata=true
      - importSuffix=.js
      - esModuleInterop=true
      - env=node
      - useDate=true
      - forceLong=string
      - stringEnums=true
      - useOptionals=messages
      - fileSuffix=.pb
      # Drops the per-file `protobufPackage` / `<PKG>_PACKAGE_NAME` constants: they collide in a
      # flat barrel and each package's GrpcPackageSpec (`<X>_GRPC_PACKAGE`) is the single source of
      # its package name.
      - exportCommonSymbols=false
inputs:
  - directory: src/proto
