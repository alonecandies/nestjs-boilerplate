# ts-proto (NestJS flavour) for native ESM. Run `bun run proto:gen` (needs `node` on PATH: the plugin
# is a `#!/usr/bin/env node` script). The output is committed; never edit src/generated by hand.
#
# These options are mirrored by GRPC_LOADER_OPTIONS (src/grpc/grpc-packages.ts). Change both together:
#   snakeToCamel (default) <-> keepCase: false
#   forceLong=string       <-> longs: String
#   stringEnums=true       <-> enums: String
#   useDate=true           <-> Timestamp <-> Date wrapper registered on the shared protobufjs instance
version: v2
clean: true
plugins:
  - local: node_modules/.bin/protoc-gen-ts_proto
    out: src/generated
    # ts-proto must see every file in one invocation (cross-file imports, well-known types).
    strategy: all
    opt:
      - nestJs=true
      - addGrpcMetadata=true
      - importSuffix=.js
      - esModuleInterop=true
      - env=node
      - useDate=true
      - forceLong=string
      - stringEnums=true
      - useOptionals=messages
      - fileSuffix=.pb
      # Drops the per-file `protobufPackage` / `<PKG>_PACKAGE_NAME` constants: they collide in a
      # flat barrel and GRPC_PACKAGES is the single source of package names.
      - exportCommonSymbols=false
inputs:
  - directory: src/proto
